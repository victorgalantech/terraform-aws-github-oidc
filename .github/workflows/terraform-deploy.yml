name: 🚀 Terraform Deploy - ABAC Bootstrap

on:
  push:
    branches: [main, develop, "feature/*"]
    paths: ['bootstrap/**', '.github/workflows/terraform-deploy.yml']
  pull_request:
    branches: [main, develop]
    paths: ['bootstrap/**', '.github/workflows/terraform-deploy.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, qa, prod]
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

# Required permissions for OIDC
permissions:
  id-token: write   # OIDC authentication
  contents: read    # Checkout code
  pull-requests: write  # Comment on PRs

env:
  TF_VERSION: '1.6.0'
  AWS_REGION: 'eu-west-1'
  WORKING_DIR: './bootstrap'

jobs:
  # ================================================
  # Job 1: Detect Environment
  # ================================================
  detect-environment:
      name: 🔍 Detect Environment
      runs-on: ubuntu-latest
      outputs:
        environment: ${{ steps.detect.outputs.environment }}
        env_upper: ${{ steps.detect.outputs.env_upper }}
        should_deploy: ${{ steps.detect.outputs.should_deploy }}
      steps:
        - id: detect
          run: |
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              ENV="${{ github.event.inputs.environment }}"
              DEPLOY="true"
            elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              ENV="prod"
              DEPLOY="true"
            else
              ENV="dev"
              DEPLOY="false"
            fi
            
            echo "environment=${ENV}" >> $GITHUB_OUTPUT
            echo "env_upper=$(echo ${ENV} | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT
            echo "should_deploy=${DEPLOY}" >> $GITHUB_OUTPUT
          
  # ================================================
  # Job 2: Terraform Validate & Lint
  # ================================================
  validate:
    name: ✅ Validate & Lint
    runs-on: ubuntu-latest
    needs: detect-environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Terraform Init (validation only)
        run: terraform init -backend=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ env.WORKING_DIR }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        id: tflint
        run: |
          tflint --init
          tflint --format compact
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Comment PR - Validation Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### 🎨 Terraform Format: \`${{ steps.fmt.outcome }}\`
            #### ✅ Terraform Validation: \`${{ steps.validate.outcome }}\`
            #### 🔍 TFLint: \`${{ steps.tflint.outcome }}\`
            
            <details><summary>Show Validation Output</summary>
            
            \`\`\`
            ${{ steps.validate.outputs.stdout }}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # ================================================
  # Job 3: Security Scanning
  # ================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          output_format: cli
          soft_fail: true
          quiet: false

      - name: Run tfsec
        id: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.WORKING_DIR }}
          soft_fail: true

      - name: Comment PR - Security Scan Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### 🔒 Security Scan Results
            
            - **Checkov**: \`${{ steps.checkov.outcome }}\`
            - **tfsec**: \`${{ steps.tfsec.outcome }}\`
            
            ✅ Security scanning complete. Review any findings above.
            
            *Environment: \`${{ needs.detect-environment.outputs.environment }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # ================================================
  # Job 4: Terraform Plan
  # ================================================
  plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    needs: [detect-environment, validate, security-scan]
    env:
      ENV: ${{ needs.detect-environment.outputs.environment }}
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', needs.detect-environment.outputs.env_upper)] }}
          role-session-name: GitHubActions-${{ github.run_id }}-${{ needs.detect-environment.outputs.environment }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-tags: |
            projectID=bootstrap
            environment=${{ env.ENV }}
            github-org=${{ github.repository_owner }}
            github-actor=${{ github.actor }}
            managed-by=github-actions
            action=terraform-apply

      - name: Verify AWS Identity
        run: |
          echo "🔐 Verifying OIDC authentication..."
          aws sts get-caller-identity
          echo "✅ Successfully authenticated with ABAC session tags"

      - name: Generate Backend Config
        run: |
          # 1. Definimos el prefijo desde GitHub Vars
          PREFIX="${{ vars.COMPANY_NAME }}"
          
          # 2. Obtenemos el Account ID directamente de AWS (ya que el step anterior nos autenticó)
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          
          # 3. Definimos el entorno (dev, qa, prod)
          ENV="${{ needs.detect-environment.outputs.environment }}"
          
          # 4. Construimos el nombre completo: prefijo-entorno-accountid
          FULL_BUCKET_NAME="${PREFIX}-tfstate-${ENV}-${ACCOUNT_ID}"
          DYNAMO_TABLE="terraform-state-locks-${ENV}"
          
          echo "📂 Usando Bucket: ${FULL_BUCKET_NAME}"
          
          # 5. Generamos el archivo
          cat > backend-config.hcl <<EOF
          bucket         = "${FULL_BUCKET_NAME}"
          key            = "bootstrap/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${DYNAMO_TABLE}"
          encrypt        = true
          EOF
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        run: |
          terraform init \
              -backend-config=backend-config.hcl \
              -input=false \
              -reconfigure
        working-directory: ${{ env.WORKING_DIR }}

      - name: Generate terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ env.AWS_REGION }}"
          environment  = "${{ env.ENV }}"
          github_org   = "${{ vars.COMPANY_NAME }}"
          github_repo  = "*"
          company_name = "${{ vars.COMPANY_NAME }}"
          
          enable_branch_restriction = true
          allowed_branches         = ["main", "develop", "release/*", "feature/*"]
          
          enable_cloudtrail        = true
          cloudtrail_retention_days = 1
          
          tags = {
            ManagedBy = "Terraform"
            Purpose   = "GitHubActionsOIDC"
            Team      = "DevOps"
            Project   = "Bootstrap"
          }
          EOF
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="environment=${{ env.ENV }}" \
            -out=tfplan-${{ env.ENV }}.binary \
            -detailed-exitcode \
            -no-color
        working-directory: ${{ env.WORKING_DIR }}

      - name: Convert plan to JSON
        if: steps.plan.outputs.exitcode == '2'
        run: terraform show -json tfplan-${{ env.ENV }}.binary > tfplan-${{ env.ENV }}.json
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENV }}
          path: ${{ env.WORKING_DIR }}/tfplan-${{ env.ENV }}.binary
          retention-days: 5

      - name: Comment PR - Plan Results
        if: github.event_name == 'pull_request' && steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/tfplan-${{ env.ENV }}.json', 'utf8');
            const planJson = JSON.parse(plan);
            
            const resourceChanges = planJson.resource_changes || [];
            const toCreate = resourceChanges.filter(r => r.change.actions.includes('create')).length;
            const toUpdate = resourceChanges.filter(r => r.change.actions.includes('update')).length;
            const toDelete = resourceChanges.filter(r => r.change.actions.includes('delete')).length;
            
            const output = `#### 📋 Terraform Plan - ${{ env.ENV }}
            
            **Changes Summary:**
            - ➕ Create: ${toCreate}
            - 🔄 Update: ${toUpdate}
            - ➖ Delete: ${toDelete}
            
            **Exit Code**: \`${{ steps.plan.outputs.exitcode }}\`
            
            <details><summary>Show Full Plan</summary>
            
            \`\`\`terraform
            Resources to create: ${toCreate}
            Resources to update: ${toUpdate}
            Resources to delete: ${toDelete}
            \`\`\`
            
            </details>
            
            **⚠️ Review the plan carefully before approving deployment.**
            
            *Environment: \`${{ env.ENV }}\` | Run ID: \`${{ github.run_id }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Plan Status
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "❌ Terraform plan failed"
          exit 1

# ================================================
  # Job 5: Terraform Apply (Requires Approval for Prod)
  # ================================================
  apply:
    name: 🚀 Terraform Apply
    runs-on: ubuntu-latest
    needs: [detect-environment, plan]
    
    env:
      ENV: ${{ needs.detect-environment.outputs.environment }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', needs.detect-environment.outputs.env_upper)] }}
          role-session-name: GitHubActions-${{ github.run_id }}-${{ needs.detect-environment.outputs.environment }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-tags: |
            projectID=bootstrap
            environment=${{ env.ENV }}
            github-org=${{ github.repository_owner }}
            github-actor=${{ github.actor }}
            managed-by=github-actions
            action=terraform-apply

      - name: Verify AWS Identity
        run: |
          echo "🔐 Verifying OIDC authentication..."
          aws sts get-caller-identity
          echo "✅ Successfully authenticated with ABAC session tags"

      - name: Generate Backend Config
        run: |
          # 1. Definimos el prefijo desde GitHub Vars
          PREFIX="${{ vars.COMPANY_NAME }}"
          
          # 2. Obtenemos el Account ID directamente de AWS (ya que el step anterior nos autenticó)
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          
          # 3. Definimos el entorno (dev, qa, prod)
          ENV="${{ needs.detect-environment.outputs.environment }}"
          
          # 4. Construimos el nombre completo: prefijo-entorno-accountid
          FULL_BUCKET_NAME="${PREFIX}-tfstate-${ENV}-${ACCOUNT_ID}"
          DYNAMO_TABLE="terraform-state-locks-${ENV}"
          
          echo "📂 Usando Bucket: ${FULL_BUCKET_NAME}"
          
          # 5. Generamos el archivo
          cat > backend-config.hcl <<EOF
          bucket         = "${FULL_BUCKET_NAME}"
          key            = "bootstrap/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${DYNAMO_TABLE}"
          encrypt        = true
          EOF
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        run: |
          terraform init \
              -backend-config=backend-config.hcl \
              -input=false \
              -reconfigure
        working-directory: ${{ env.WORKING_DIR }}

      - name: Generate terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ env.AWS_REGION }}"
          environment  = "${{ env.ENV }}"
          github_org   = "${{ vars.COMPANY_NAME }}"
          github_repo  = "*"
          company_name = "${{ vars.COMPANY_NAME }}"
          
          enable_branch_restriction = true
          allowed_branches         = ["main", "develop", "release/*", "feature/*"]
          
          enable_cloudtrail        = true
          cloudtrail_retention_days = 1
          
          tags = {
            ManagedBy = "Terraform"
            Purpose   = "GitHubActionsOIDC"
            Team      = "DevOps"
            Project   = "Bootstrap"
          }
          EOF
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="environment=${{ env.ENV }}" \
            -out=tfplan-${{ env.ENV }}.binary \
            -detailed-exitcode \
            -no-color
        working-directory: ${{ env.WORKING_DIR }} 

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan-${{ env.ENV }}.binary
        working-directory: ${{ env.WORKING_DIR }}

      - name: Output deployment summary
        if: success()
        run: |
          echo " Deployment successful!"
          echo "Environment: ${{ env.ENV }}"
          echo "Run ID: ${{ github.run_id }}"
          terraform output -json > outputs.json
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ env.ENV }}
          path: ${{ env.WORKING_DIR }}/outputs.json
          retention-days: 30

      - name: Verify CloudTrail logging
        if: success()
        run: |
          echo "🔍 Verifying CloudTrail is logging OIDC events..."
          aws cloudtrail lookup-events \
            --lookup-attributes AttributeKey=EventName,AttributeValue=AssumeRoleWithWebIdentity \
            --max-results 5 \
            --query 'Events[*].[EventTime,Username,CloudTrailEvent]' \
            --output table || echo "⚠️ No recent OIDC events found (this is normal for first deployment)"

      - name: Comment PR - Deployment Success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### ✅ Deployment Successful - ${{ env.ENV }}
            
            **Environment**: \`${{ env.ENV }}\`
            **Run ID**: \`${{ github.run_id }}\`
            **Actor**: @${{ github.actor }}
            
            🎉 Infrastructure deployed successfully with ABAC security!
            
            **Next Steps:**
            1. Verify resources in AWS Console
            2. Check CloudTrail for audit logs
            3. Test ABAC isolation between projects
            
            [View CloudTrail Events](https://console.aws.amazon.com/cloudtrail/)`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # ================================================
  # Job 6: Drift Detection (Scheduled)
  # ================================================
  drift-detection:
    name: 🔍 Drift Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, prod]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare environment variables
        id: prep
        run: |
          echo "ENV_UPPER=$(echo ${{ matrix.environment }} | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', steps.prep.outputs.ENV_UPPER)] }}
          role-session-name: DriftDetection-${{ github.run_id }}-${{ matrix.environment }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-tags: |
            projectID=bootstrap
            environment=${{ matrix.environment }}
            action=drift-detection

      - name: Generate Backend Config
        run: |
          # 1. Definimos el company name desde GitHub Vars
          COMPANY="${{ vars.COMPANY_NAME }}"
          
          # 2. Obtenemos el Account ID directamente de AWS (ya que el step anterior nos autenticó)
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          
          # 3. Definimos el entorno (dev, qa, prod)
          ENV="${{ matrix.environment }}"
          
          # 4. Construimos el nombre completo: company-tfstate-entorno-accountid
          FULL_BUCKET_NAME="${COMPANY}-tfstate-${ENV}-${ACCOUNT_ID}"
          DYNAMO_TABLE="terraform-state-locks-${ENV}"
          
          echo "📂 Usando Bucket: ${FULL_BUCKET_NAME}"
          
          # 5. Generamos el archivo
          cat > backend-config.hcl <<EOF
          bucket         = "${FULL_BUCKET_NAME}"
          key            = "bootstrap/terraform.tfstate"
          region         = "${{ env.AWS_REGION }}"
          dynamodb_table = "${DYNAMO_TABLE}"
          encrypt        = true
          EOF
        working-directory: ${{ env.WORKING_DIR }}

      - name: Generate terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ env.AWS_REGION }}"
          environment  = "${{ matrix.environment }}"
          github_org   = "${{ vars.COMPANY_NAME }}"
          github_repo  = "${{ vars.GITHUB_REPO }}"
          company_name = "${{ vars.COMPANY_NAME }}"
          
          enable_branch_restriction = false
          allowed_branches         = ["main", "develop", "release/*"]
          
          enable_cloudtrail        = true
          cloudtrail_retention_days = 1
          
          tags = {
            ManagedBy = "Terraform"
            Purpose   = "GitHubActionsOIDC"
            Team      = "DevOps"
          }
          EOF
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -backend-config=backend-config.hcl
        working-directory: ${{ env.WORKING_DIR }}

      - name: Detect Drift
        id: drift
        run: |
          # El exit code 2 indica que hay cambios (drift)
          terraform plan \
            -var="environment=${{ matrix.environment }}" \
            -detailed-exitcode \
            -no-color
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Create issue if drift detected
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Infrastructure Drift Detected - ${{ matrix.environment }}`,
              body: `Se ha detectado una desviación (drift) en el entorno **${{ matrix.environment }}**.
              
              El estado real en AWS no coincide con la configuración de Terraform.
              
              **Detalles de la ejecución:**
              - Run ID: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              - Fecha: ${new Date().toUTCString()}
              
              Por favor, revisa el plan y aplica los cambios necesarios para reconciliar la infraestructura.`,
              labels: ['drift', 'infrastructure', '${{ matrix.environment }}']
            })