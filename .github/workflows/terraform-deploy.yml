name: Terraform Deploy - ABAC Bootstrap

on:
  push:
    branches: [main, develop, "feature/*", "release/*"]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/terraform-deploy.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/terraform-deploy.yml'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC - weekly drift detection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, qa, prod]
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options: [plan, apply]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

env:
  TF_VERSION: '1.10.0'
  AWS_REGION: 'eu-west-1'
  WORKING_DIR: './bootstrap'

jobs:
  # ============================================================
  # Job 1: Detect Environment
  # ============================================================
  detect-environment:
    name: Detect Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      env_upper:   ${{ steps.detect.outputs.env_upper }}
    steps:
      - id: detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="prod"
          else
            ENV="dev"
          fi
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "env_upper=$(echo ${ENV} | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

  # ============================================================
  # Job 2: Validate & Lint
  # ============================================================
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    needs: detect-environment
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Terraform Init (no backend)
        run: terraform init -backend=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ env.WORKING_DIR }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        id: tflint
        run: |
          tflint --init
          tflint --format compact
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Comment PR - Validation Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### 🎨 Terraform Format: \`${{ steps.fmt.outcome }}\`
            #### ✅ Terraform Validation: \`${{ steps.validate.outcome }}\`
            #### 🔍 TFLint: \`${{ steps.tflint.outcome }}\`

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`
            })

  # ============================================================
  # Job 3: Security Scan
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          output_format: cli
          soft_fail: true
          quiet: false

      - name: Run tfsec
        id: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.WORKING_DIR }}
          soft_fail: true

      - name: Comment PR - Security Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### 🔒 Security Scan Results

            - **Checkov**: \`${{ steps.checkov.outcome }}\`
            - **tfsec**: \`${{ steps.tfsec.outcome }}\`

            *Environment: \`${{ needs.detect-environment.outputs.environment }}\`*`
            })

  # ============================================================
  # Job 4: Terraform Plan
  # ============================================================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [detect-environment, validate, security-scan]
    if: github.event_name != 'schedule'
    env:
      ENV: ${{ needs.detect-environment.outputs.environment }}
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', needs.detect-environment.outputs.env_upper)] }}
          role-session-name: TerraformPlan-${{ github.run_id }}-${{ env.ENV }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-tags: |
            Project=bootstrap
            environment=${{ env.ENV }}
            github-org=${{ github.repository_owner }}
            github-actor=${{ github.actor }}
            managed-by=github-actions
            action=terraform-plan

      - name: Generate backend config
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          BUCKET="${{ vars.COMPANY_NAME }}-tfstate-${{ env.ENV }}-${ACCOUNT_ID}"
          echo "Using bucket: ${BUCKET}"
          cat > backend-config.hcl <<EOF
          bucket       = "${BUCKET}"
          key          = "bootstrap/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          EOF
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -backend-config=backend-config.hcl -input=false -reconfigure
        working-directory: ${{ env.WORKING_DIR }}

      - name: Generate terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region                = "${{ env.AWS_REGION }}"
          environment               = "${{ env.ENV }}"
          company_name              = "${{ vars.COMPANY_NAME }}"
          github_org                = "${{ vars.COMPANY_NAME }}"
          github_repo               = "*"
          enable_branch_restriction = true
          allowed_branches          = ["main", "develop", "release/*", "feature/*"]
          enable_cloudtrail         = false
          cloudtrail_retention_days = 1
          enable_abac               = true
          tags = {
            ManagedBy   = "Terraform"
            Team        = "DevOps"
            Project     = "bootstrap"
            environment = "${{ env.ENV }}"
          }
          EOF
        working-directory: ${{ env.WORKING_DIR }}

      - name: Reconcile state bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          BUCKET="${{ vars.COMPANY_NAME }}-tfstate-${{ env.ENV }}-${ACCOUNT_ID}"
          if aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            if terraform state show aws_s3_bucket.terraform_state 2>/dev/null | grep -q "${BUCKET}"; then
              echo "State bucket already tracked - skipping import"
            else
              echo "Importing state bucket..."
              terraform import aws_s3_bucket.terraform_state "${BUCKET}"
            fi
          else
            echo "Bucket not found in AWS - will be created by plan/apply"
          fi
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -out=tfplan-${{ env.ENV }}.binary \
            -detailed-exitcode \
            -no-color
        working-directory: ${{ env.WORKING_DIR }}

      - name: Convert plan to JSON
        if: steps.plan.outputs.exitcode == '2'
        run: terraform show -json tfplan-${{ env.ENV }}.binary > tfplan-${{ env.ENV }}.json
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENV }}
          path: ${{ env.WORKING_DIR }}/tfplan-${{ env.ENV }}.binary
          retention-days: 5

      - name: Comment PR - Plan Results
        if: github.event_name == 'pull_request' && steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = JSON.parse(fs.readFileSync('${{ env.WORKING_DIR }}/tfplan-${{ env.ENV }}.json', 'utf8'));
            const changes = plan.resource_changes || [];
            const toCreate = changes.filter(r => r.change.actions.includes('create')).length;
            const toUpdate = changes.filter(r => r.change.actions.includes('update')).length;
            const toDelete = changes.filter(r => r.change.actions.includes('delete')).length;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### 📋 Terraform Plan - ${{ env.ENV }}

            **Changes:** ➕ ${toCreate} &nbsp; 🔄 ${toUpdate} &nbsp; ➖ ${toDelete}

            ⚠️ Review carefully before approving deployment.

            *Run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*`
            })

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  # ============================================================
  # Job 5: Terraform Apply
  # ============================================================
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [detect-environment, plan]
    if: needs.plan.outputs.exitcode == '2' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
    env:
      ENV: ${{ needs.detect-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', needs.detect-environment.outputs.env_upper)] }}
          role-session-name: TerraformApply-${{ github.run_id }}-${{ env.ENV }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-tags: |
            Project=bootstrap
            environment=${{ env.ENV }}
            github-org=${{ github.repository_owner }}
            github-actor=${{ github.actor }}
            managed-by=github-actions
            action=terraform-apply

      - name: Generate backend config
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          BUCKET="${{ vars.COMPANY_NAME }}-tfstate-${{ env.ENV }}-${ACCOUNT_ID}"
          echo "Using bucket: ${BUCKET}"
          cat > backend-config.hcl <<EOF
          bucket       = "${BUCKET}"
          key          = "bootstrap/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          EOF
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -backend-config=backend-config.hcl -input=false -reconfigure
        working-directory: ${{ env.WORKING_DIR }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.ENV }}
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan-${{ env.ENV }}.binary
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload outputs
        if: success()
        run: terraform output -json > outputs.json
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload outputs artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ env.ENV }}
          path: ${{ env.WORKING_DIR }}/outputs.json
          retention-days: 30

      # - name: Verify CloudTrail logging
      #   if: success()
      #   run: |
      #     aws cloudtrail lookup-events \
      #       --lookup-attributes AttributeKey=EventName,AttributeValue=AssumeRoleWithWebIdentity \
      #       --max-results 5 \
      #       --query 'Events[*].[EventTime,Username,CloudTrailEvent]' \
      #       --output table || echo "No recent OIDC events found (normal for first deployment)"

      - name: Comment PR - Deployment Success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### ✅ Deployment Successful - ${{ env.ENV }}

            **Run ID:** \`${{ github.run_id }}\` &nbsp; **Actor:** @${{ github.actor }}`
            })

  # ============================================================
  # Job 6: Drift Detection (runs every Monday 06:00 UTC)
  # ============================================================
  drift-detection:
    name: Drift Detection (${{ matrix.environment }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        id: prep
        run: echo "ENV_UPPER=$(echo ${{ matrix.environment }} | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', steps.prep.outputs.ENV_UPPER)] }}
          role-session-name: DriftDetection-${{ github.run_id }}-${{ matrix.environment }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-tags: |
            Project=bootstrap
            environment=${{ matrix.environment }}
            managed-by=github-actions
            action=drift-detection

      - name: Generate backend config
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          BUCKET="${{ vars.COMPANY_NAME }}-tfstate-${{ matrix.environment }}-${ACCOUNT_ID}"
          echo "Using bucket: ${BUCKET}"
          cat > backend-config.hcl <<EOF
          bucket       = "${BUCKET}"
          key          = "bootstrap/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          EOF
        working-directory: ${{ env.WORKING_DIR }}

      - name: Generate terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region                = "${{ env.AWS_REGION }}"
          environment               = "${{ matrix.environment }}"
          company_name              = "${{ vars.COMPANY_NAME }}"
          github_org                = "${{ vars.COMPANY_NAME }}"
          github_repo               = "*"
          enable_branch_restriction = true
          allowed_branches          = ["main", "develop", "release/*", "feature/*"]
          enable_cloudtrail         = false
          cloudtrail_retention_days = 1
          enable_abac               = true
          tags = {
            ManagedBy   = "Terraform"
            Team        = "DevOps"
            Project     = "bootstrap"
            environment = "${{ matrix.environment }}"
          }
          EOF
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -backend-config=backend-config.hcl -input=false -reconfigure
        working-directory: ${{ env.WORKING_DIR }}

      - name: Detect Drift
        id: drift
        run: |
          terraform plan \
            -detailed-exitcode \
            -no-color
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Create issue if drift detected
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Infrastructure Drift Detected - ${{ matrix.environment }}`,
              body: `Drift detected in **${{ matrix.environment }}** environment.

            The real AWS state no longer matches the Terraform configuration.

            **Run:** [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Date:** ${new Date().toUTCString()}

            Please review and apply changes to reconcile infrastructure.`,
              labels: ['drift', 'infrastructure', '${{ matrix.environment }}']
            })